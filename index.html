    llm_score:p.score,tier:p.tier,interest:R[p.id].interest,match:R[p.id].match,note:(R[p.id].note||''),ts:ts})).join('\n');}

function dedup(a){return Array.from(new Set(a));}
function toggleSave(el){const i=+el.dataset.i, id=PAPERS[i].id;
  if(SAVED.has(id)) SAVED.delete(id); else SAVED.add(id);
  el.classList.toggle('on', SAVED.has(id));
  el.classList.remove('anim'); void el.offsetWidth; el.classList.add('anim');
  document.getElementById('qbtn').textContent = '🔖 saved ('+SAVED.size+')'; refreshShelf(); markDirty();}
function bibkey(p){const a=(p.authors||'').split(/,| and /)[0].trim().split(/\s+/).pop()||'anon';
  const w=((p.title||'').match(/[A-Za-z]{4,}/)||['ref'])[0];
  return (a+(p.year||'')+w).replace(/[^A-Za-z0-9]/g,'');}
function bibtex(p){const cl=s=>(s||'').replace(/[{}]/g,'');
  return `@article{${bibkey(p)},\n  title = {${cl(p.title)}},\n  author = {${cl(p.authors)}},`+
    `\n  journal = {${cl(p.venue)}},\n  year = {${p.year||''}},\n  doi = {${p.doi||''}},\n  url = {${p.url||''}}\n}`;}
function dlBib(){const items=PAPERS.filter(p=>SAVED.has(p.id));
  if(!items.length){toast('Star a paper (☆) to add it to the reading queue first'); return;}
  const bib=items.map(bibtex).join('\n\n');
  const blob=new Blob([bib+'\n'],{type:'application/x-bibtex'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='reading_queue_'+'2026-08-21'+'.bib'; a.click();
  toast('Saved '+items.length+' entr'+(items.length>1?'ies':'y')+' — append to reading_queue.bib (apply_queue.py)');}

    bank:{remove:dedup(PATCH.bank.remove), add:PATCH.bank.add}};
  const blob=new Blob([JSON.stringify(P,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='taste-patch_'+'2026-08-21'+'.json'; a.click();
  toast('Saved taste-patch_'+'2026-08-21'+'.json — run: python3 src/apply_taste_patch.py <file>');}

function stamp(){return new Date().toISOString().replace(/[-:T]/g,'').slice(0,15);}
function tcountShow(){const e=document.getElementById('tcount'); if(e) e.textContent=nTaste()+' taste edits';}
function pendingCount(){
  const touched = Object.values(R).filter(x=>('verdict' in x)?(x.verdict||(x.note&&x.note.trim())):(x.interest>1||x.match>1||(x.note&&x.note.trim()))).length;
  return touched + SAVED.size + nTaste();
}
function updSubmit(){
  const b=document.getElementById('subbtn'); if(!b) return;
  const n=pendingCount();
  b.disabled = n===0;
  b.classList.toggle('ready', n>0);
  if(n>_lastPending){ b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse'); clearTimeout(b._pt); b._pt=setTimeout(function(){b.classList.remove('pulse');},650); }   // brief ONE-SHOT pulse only when new feedback is added — no constant shimmer
  _lastPending=n;
  b.title = n? ('⬆ Submit feedback ('+n+')') : 'Nothing to submit yet — rate a paper or add a taste edit';
  const s=document.getElementById('synced');
  if(s && everSubmitted && !dirty){ s.textContent='✓ submitted'; s.classList.remove('warn'); }
}
function markDirty(){ dirty=true; const s=document.getElementById('synced'); if(s){s.textContent='● unsaved'; s.classList.add('warn');} saveDraft(); updSubmit(); }
function paintRestored(){        // reflect a restored draft in the freshly-built DOM (pips, notes, saves, verdicts)
  PAPERS.forEach((p,i)=>{
    const r=R[p.id];
    if(!p.nm){
      ['interest','match'].forEach(dim=>{
        const grp=document.querySelector('.pips[data-i="'+i+'"][data-d="'+dim+'"]');
        if(grp)[...grp.children].forEach(b=>{const bv=+b.dataset.v; b.classList.toggle('fill',bv<=r[dim]); b.setAttribute('aria-checked',bv===r[dim]?'true':'false');});
      });
      const _sb=document.querySelector('.segbar[data-i="'+i+'"]'); if(_sb){ const _cur=(r.interest===r.match)?r.interest:0; _sb.querySelectorAll('.sv').forEach(b=>{const on=(+b.dataset.v===_cur); b.classList.toggle('on',on); b.setAttribute('aria-checked',on?'true':'false');}); }
    } else if(r.verdict){
      document.querySelectorAll('.vbtn[data-i="'+i+'"]').forEach(b=>b.classList.toggle('on', b.dataset.v===r.verdict));
    }
    const note=document.querySelector('.note[data-i="'+i+'"]'); if(note&&r.note) note.value=r.note;
    const sv=document.querySelector('.savebtn[data-i="'+i+'"]'); if(sv) sv.classList.toggle('on', SAVED.has(p.id));
    const on = p.nm ? (!!r.verdict||!!(r.note||'').trim()) : (r.interest>1||r.match>1||!!(r.note||'').trim());
    const card=document.getElementById('c'+i); if(card) card.classList.toggle('rated', on);
  });
  const q=document.getElementById('qbtn'); if(q) q.textContent='🔖 saved ('+SAVED.size+')';
  refreshShelf(); updCount(); tcountShow(); updSubmit();
}
function queueBibStr(){const items=PAPERS.filter(p=>SAVED.has(p.id)); return items.length ? items.map(bibtex).join('\n\n') : '';}
function tastePatchStr(){
  if(nTaste()===0) return '';
  const P={_kind:'taste-patch', ts:new Date().toISOString(), date:TODAY,
    negatives:{add:PATCH.negatives.add, disable:dedup(PATCH.negatives.disable), enable:dedup(PATCH.negatives.enable)},
    profile:{pinned_notes:PATCH.profile.pinned_notes, themes:PATCH.profile.themes},
    pool:{enable:dedup(PATCH.pool.enable), disable:dedup(PATCH.pool.disable), add_keywords:dedup(PATCH.pool.add_keywords)},
    bank:{remove:dedup(PATCH.bank.remove), add:PATCH.bank.add}};
  return JSON.stringify(P,null,1);

function downloadFile(name, content, mime){const blob=new Blob([content],{type:mime||'text/plain'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();}
async function submitFeedback(){
  const files=[], sfx=stamp();
  const rat = lines();      // rate-mode papers (Interest/Match)
  const nm = nearLines();   // near-miss papers (verdict) — the folded-in final section
  if(rat) files.push({name:'ratings_sync_'+TODAY+'_'+sfx+'.jsonl', content:rat+'\n'});
  if(nm) files.push({name:'nearmiss_sync_'+TODAY+'_'+sfx+'.jsonl', content:nm+'\n'});
  const bib=queueBibStr(); if(bib) files.push({name:'reading_queue_sync_'+TODAY+'_'+sfx+'.bib', content:bib+'\n'});
  const tp=tastePatchStr(); if(tp) files.push({name:'taste-patch_sync_'+TODAY+'_'+sfx+'.json', content:tp});
  if(!files.length){toast('Nothing to submit yet — rate a paper, ☆ save one, or add a taste edit'); return;}
  const b=document.getElementById('subbtn'), bt=b?b.querySelector('.t'):null;
  const CK='<svg class="ck" viewBox="0 0 24 24"><path d="M4 12.5l5 5 11-12"/></svg>';
  if(b){b.disabled=true; b.classList.add('loading');} if(bt) bt.innerHTML='<span class="spin"></span> Submitting…';
  function subDone(msg){ if(b)b.classList.remove('loading'); if(bt)bt.innerHTML=CK+' '+msg; setTimeout(updSubmit,1600); }
  if(SERVED){
    try{
      const r=await fetch('/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({files:files})});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const j=await r.json();
      if(!j.ok) throw new Error(j.error || ('HTTP '+r.status));
      everSubmitted=true; dirty=false; saveDraft();
      const s=document.getElementById('synced'); if(s){s.classList.remove('warn'); s.textContent='✓ submitted '+files.length+' file(s)';}
      toast(j.applied ? ('✓ Submitted '+files.length+' file(s) — applied now: '+j.applied) : ('✓ Submitted '+files.length+' file(s) → auto-applies within ~10 min'));
      subDone('Submitted'); return;
    }catch(e){ toast('Local server unreachable ('+e.message+') — downloading the patch to import manually'); }
  } else {
    toast('Preview page — downloaded the patch. To submit directly, open http://localhost:8765 (serve_inbox).');
  }
  files.forEach(f=>downloadFile(f.name, f.content, f.name.endsWith('.bib')?'application/x-bibtex':(f.name.endsWith('.json')?'application/json':'application/x-ndjson')));
  everSubmitted=true; dirty=false; saveDraft();
  subDone('Downloaded');
}

  let acc=0, stops=[]; order.forEach(s=>{ if(byTier[s]){ const frac=byTier[s]/total*100; stops.push(`var(--${s}) ${acc.toFixed(1)}% ${(acc+frac).toFixed(1)}%`); acc+=frac; } });

    (days.length?`<div class="wm-heat" title="papers per day">${(function(){const hm=Math.max.apply(null,days.map(x=>byDay[x]).concat([1]));return days.map(dd=>`<i style="background:color-mix(in srgb,var(--brand) ${Math.round(byDay[dd]/hm*80)}%,var(--rule))" title="${dd}: ${byDay[dd]}"></i>`).join('');})()}</div>`:'');

const PAL={items:[], k:0};
// search over ALL papers (title · journal · abstract) — commands/views/sections removed; this is a pure paper search
function palData(){

// fuzzy search helpers: subsequence (typo tolerance) + multi-token paper scoring across title/journal/abstract
function _subseq(hay,q){ let i=0,j=0; while(i<hay.length&&j<q.length){ if(hay[i]===q[j])j++; i++; } return j===q.length; }
function _paperScore(o,tokens){ let s=0;
  for(const tk of tokens){ const inT=o._title.indexOf(tk), inV=o._ven.indexOf(tk), inA=o._abs.indexOf(tk);
    if(inT<0&&inV<0&&inA<0){ if(_subseq(o._title,tk)){ s+=1; continue; } return -1; }   // every token must appear somewhere (fuzzy on title as fallback)
    s += (inT>=0?6:0) + (inV>=0?3:0) + (inA>=0?1:0) + (inT===0?4:0); }
  return s; }

// wrap the matched query tokens in <span class="ph"> (red) for the palette results
function palMark(text,ql){ text=text||''; if(!ql) return esc(text);
  const low=text.toLowerCase(), tokens=ql.split(/\s+/).filter(Boolean); let ranges=[];
  tokens.forEach(tk=>{ let i=0; while((i=low.indexOf(tk,i))>=0){ ranges.push([i,i+tk.length]); i+=tk.length; } });
  if(!ranges.length) return esc(text);
  ranges.sort((a,b)=>a[0]-b[0]); let merged=[ranges[0]];
  for(let k=1;k<ranges.length;k++){ const last=merged[merged.length-1]; if(ranges[k][0]<=last[1]) last[1]=Math.max(last[1],ranges[k][1]); else merged.push(ranges[k]); }
  let out='',prev=0; merged.forEach(r=>{ out+=esc(text.slice(prev,r[0]))+'<span class="ph">'+esc(text.slice(r[0],r[1]))+'</span>'; prev=r[1]; }); return out+esc(text.slice(prev)); }
function palRender(qv){
  const all=palData(), ql=(qv||'').toLowerCase().trim();
  let list;
  if(!ql){ list=all; }
  else { const tokens=ql.split(/\s+/).filter(Boolean), scored=[];
    all.forEach(o=>{ let s;
      if(o.k==='paper'){ s=_paperScore(o,tokens); }
      else { const lt=o.t.toLowerCase(); s = tokens.every(tk=>lt.indexOf(tk)>=0) ? 50 : (_subseq(lt,ql)?12:-1); }
      if(s>=0) scored.push({o:o,s:s}); });
    scored.sort((a,b)=>b.s-a.s); list=scored.map(x=>x.o); }
  PAL.items=list.slice(0,40);
  const box=document.getElementById('palist'); if(!box)return;
  box.innerHTML=PAL.items.length? PAL.items.map((o,i)=>`<div class="palopt${i===PAL.k?' k-on':''}" data-i="${i}"><span class="pt">${palMark(o.t,ql)}</span><span class="k">${palMark(o.sub||o.k,ql)}</span></div>`).join('')
    : '<div class="palopt"><span class="pt">no matches</span></div>';
  [...box.querySelectorAll('.palopt[data-i]')].forEach(el=>el.addEventListener('click',()=>palGo(+el.dataset.i)));
}
function palHi(){ const box=document.getElementById('palist'); if(!box)return;
  [...box.children].forEach((el,i)=>el.classList.toggle('k-on', i===PAL.k));
  const cur=box.children[PAL.k]; if(cur&&cur.scrollIntoView) cur.scrollIntoView({block:'nearest'}); }
function palKey(e){
  if(e.key==='ArrowDown'){e.preventDefault(); PAL.k=Math.min(PAL.k+1,PAL.items.length-1); palHi();}
  else if(e.key==='ArrowUp'){e.preventDefault(); PAL.k=Math.max(PAL.k-1,0); palHi();}
  else if(e.key==='Enter'){e.preventDefault(); palGo(PAL.k);}
  else if(e.key==='Escape'){ closePal(); } }
function palGo(i){ const o=PAL.items[i]; if(!o)return; closePal(); if(o.go)o.go(); }

// #1 keyboard navigation + rating
function visCards(){ return [...document.querySelectorAll('#cardzone .card')]; }
function focusCardEl(el){ document.querySelectorAll('#cardzone .card.kbfocus').forEach(c=>{ if(c!==el)c.classList.remove('kbfocus'); }); if(el)el.classList.add('kbfocus'); }
function kbMove(d){ const vc=visCards(); if(!vc.length)return;
  let cur=vc.findIndex(c=>c.classList.contains('kbfocus'));
  let ni = cur<0 ? (d>0?0:vc.length-1) : Math.min(Math.max(cur+d,0),vc.length-1);
  focusCardEl(vc[ni]); vc[ni].scrollIntoView({behavior:'smooth',block:'center'}); }
function kbNextUnrated(){ const vc=visCards(); if(!vc.length)return;
  const start=vc.findIndex(c=>c.classList.contains('kbfocus'));
  for(let j=1;j<=vc.length;j++){ const el=vc[(Math.max(start,0)+j)%vc.length]; if(!isRated(PAPERS[+el.dataset.i])){ focusCardEl(el); el.scrollIntoView({behavior:'smooth',block:'center'}); return; } }
  toast('All visible papers rated ✓'); }
function kbRate(v){ const el=document.querySelector('#cardzone .card.kbfocus'); if(!el)return;
  const i=+el.dataset.i; if(PAPERS[i].nm)return;
  const grp=el.querySelector('.pips[data-d="interest"]'); if(!grp)return;
  const btn=grp.querySelector('.pip[data-v="'+v+'"]'); if(btn)set(btn); }
document.addEventListener('keydown',function(e){
  const _deck=document.getElementById('deck');
  if(_deck&&_deck.classList.contains('on')){                                   // D1 deck keys
    const ae0=document.activeElement, tg0=ae0?ae0.tagName:'';
    if(e.key==='Escape'){ closeDeck(); return; }
    if(tg0==='INPUT'||tg0==='TEXTAREA') return;
    var _dk=(e.key||'').toLowerCase();
    if(_dk==='a'){ e.preventDefault(); deckVote(5); }                 // a Interested
    else if(_dk==='s'){ e.preventDefault(); deckVote(3); }            // s Maybe
    else if(_dk==='d'){ e.preventDefault(); deckVote(2); }            // d Not for me (=2)
    else if(e.key==='ArrowLeft'||_dk==='j'){ e.preventDefault(); deckPrev(); }        // <- prev
    else if(e.key==='ArrowRight'||_dk==='k'){ e.preventDefault(); deckNext(); }       // -> skip
    else if(e.key==='ArrowUp'||e.key==='ArrowDown'){ e.preventDefault(); deckSave(); }  // save (press again = unsave; deckSave already toggles)
    else if(e.key>='1'&&e.key<='5'){ e.preventDefault(); const k=+e.key, v = k>=4?5:(k>=2?3:2); deckVote(v); }   // 4-5→Interested · 2-3→Maybe · 1→Not(2)
    return;
  }
  const _set=document.getElementById('setmodal');
  if(_set&&_set.classList.contains('on')){ if(e.key==='Escape') closeSettings(); return; }
  const _sv=document.getElementById('savedmodal');
  if(_sv&&_sv.classList.contains('on')){ if(e.key==='Escape') closeSaved(); return; }
  const _gr=document.getElementById('graphov');
  if(_gr&&_gr.classList.contains('on')){ if(e.key==='Escape') closeGraph(); return; }
  if(e.metaKey||e.ctrlKey){ if(e.key.toLowerCase()==='k'){ e.preventDefault(); const pal=document.getElementById('pal'); (pal&&pal.classList.contains('show'))?closePal():openPal(); } return; }
  const ae=document.activeElement, tag=ae?ae.tagName:'';
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(ae&&ae.isContentEditable)) return;
  const pal=document.getElementById('pal'); if(pal&&pal.classList.contains('show')) return;
  if(e.key==='/'){ e.preventDefault(); openPal(); }
  else if(e.key==='j'){ e.preventDefault(); kbMove(1); }
  else if(e.key==='k'){ e.preventDefault(); kbMove(-1); }
  else if(e.key==='n'){ e.preventDefault(); kbNextUnrated(); }
  else if(e.key==='f'){ e.preventDefault(); toggleFocusMode(); }
  else if(e.key>='1'&&e.key<='5'){ kbRate(+e.key); }
  else if(e.key==='?'){ toast('keys — j/k: move · 1-5: interest · n: next unrated · f: focus mode · / or ⌘K: palette'); }
});

// #17 relevance dial counts up when it scrolls into view (_dialIO declared up top)
function dialOn(){ return localStorage.getItem('dp_dial')==='1'; }   // score count-up dial; default OFF (heavy on big/All lists)
function refreshDials(){
  if(_dialIO) _dialIO.disconnect();
  if(!dialOn()){   // off: meters keep their rendered --v / number from cardHTML; create NO IntersectionObservers
    document.querySelectorAll('#cardzone .meter.g').forEach(m=>{ const to=+m.dataset.score; if(!isNaN(to)){ m.style.setProperty('--v',to); const b=m.querySelector('b'); if(b)b.textContent=to; } m.dataset.done='1'; });
    return;
  }
  if(!('IntersectionObserver' in window)) return;
  _dialIO=new IntersectionObserver(function(es){ es.forEach(function(en){ if(en.isIntersecting){ animDial(en.target); _dialIO.unobserve(en.target); } }); },{threshold:.5});
  document.querySelectorAll('#cardzone .meter.g').forEach(m=>{ if(m.dataset.done!=='1') _dialIO.observe(m); });
}
function animDial(m){ const to=+m.dataset.score; if(isNaN(to))return; m.dataset.done='1';
  const b=m.querySelector('b');
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){ m.style.setProperty('--v',to); if(b)b.textContent=to; return; }
  let v=0; m.style.setProperty('--v',0); if(b)b.textContent='0';
  const iv=setInterval(function(){ v++; m.style.setProperty('--v',v); if(b)b.textContent=v; if(v>=to)clearInterval(iv); },55); }

// #8 scrollspy — re-wired after every layout (_spyIO declared up top, before first layout)
function wireScrollspy(){
  if(_spyIO) _spyIO.disconnect();
  const links=[...document.querySelectorAll('nav .navlink')]; if(!links.length)return;
  const map=Object.fromEntries(links.map(a=>[a.getAttribute('href').slice(1),a]));
  _spyIO=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){
    links.forEach(l=>l.classList.remove('active')); const a=map[e.target.id]; if(a){a.classList.add('active'); moveNavInd();} } }); },
    {rootMargin:'-45% 0px -50% 0px',threshold:0});
  document.querySelectorAll('#cardzone section').forEach(s=>_spyIO.observe(s));
}

function reduceMotion(){ try{return !!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);}catch(e){return false;} }

function animateOut(el, done){
  if(!el){ done&&done(); return; }
  cancelAnim(el); el._dpAnim=true;
  el.style.maxHeight=el.scrollHeight+'px'; el.classList.add('dp-dismissing');
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ if(el._dpAnim) el.classList.add('dp-gone'); }); });
  let fired=false;
  const finish=function(){ if(fired)return; fired=true; if(el._dpEnd)el.removeEventListener('transitionend',el._dpEnd);
    const was=el._dpAnim; el._dpAnim=false; el.classList.remove('dp-dismissing','dp-gone'); el.style.maxHeight='';
    if(was) done&&done(); };
  el._dpEnd=function(ev){ if(ev.target===el && (ev.propertyName==='max-height'||ev.propertyName==='transform')) finish(); };
  el.addEventListener('transitionend',el._dpEnd); el._dpTimer=setTimeout(finish,700);

function hlAbs(text,kws){ let s=esc(text||''); if(!kws||!kws.length) return s;
  const terms=[],seen={}; kws.forEach(k=>{const t=(k.kw||'').trim(); if(t&&!seen[t.toLowerCase()]){seen[t.toLowerCase()]=1; terms.push(t);}}); terms.sort((a,b)=>b.length-a.length);

  if(!marks.length) return s; marks.sort((a,b)=>a[0]-b[0]);

  let out='',prev=0; merged.forEach(m=>{ out+=s.slice(prev,m[0])+'<mark>'+s.slice(m[0],m[1])+'</mark>'; prev=m[1]; }); return out+s.slice(prev); }

  VIEW.sel=[]; VIEW.selMode="any";
  var _TAL=null;

  function gset(o){ if(!o._gs){ var s={}; (o.p.matched||[]).forEach(function(m){
        var q=m.src||"", i=q.indexOf(":"), g=(i>=0?q.slice(i+1):q).trim(); if(g) s[g]=1; });
      o._gs=s; } return o._gs; }
  function tset(o){ if(!o._ts){ var s={};
      (o.p.matched||[]).forEach(function(m){ var k=(m.kw||"").toLowerCase(); if(k) s[k]=1; });
      (o.p.suggest||[]).forEach(function(x){ var k=(x||"").toLowerCase(); if(k) s[k]=1; });
      o._ts=s; } return o._ts; }
  function hit(o,it){ return it.k==="th" ? !!gset(o)[it.v] : !!tset(o)[it.v]; }
  window.themeSet=function(o){ return Object.keys(gset(o)); };

  var _pass=passFilter, _BASE=0;
  passFilter=function(o){
    if(!_pass(o)) return false;
    var S=VIEW.sel; if(_BASE||!S||!S.length) return true;
    if(VIEW.selMode==="all"){ for(var i=0;i<S.length;i++){ if(!hit(o,S[i])) return false; } return true; }
    for(var j=0;j<S.length;j++){ if(hit(o,S[j])) return true; }
    return false; };
  /* the cards passing every filter EXCEPT this one -- so the picker counts (and the themes panel)
     describe what you could still select, instead of collapsing to whatever is already selected */
  window.kwBaseCards=function(){ _BASE=1; var v=CARDS.filter(passFilter); _BASE=0; return v; };

  if(typeof filterActive==="function"){ var _fa=filterActive;
    filterActive=function(){ return (VIEW.sel&&VIEW.sel.length>0)||_fa.apply(this,arguments); }; }
  if(typeof resetView==="function"){ var _rv=resetView;
    resetView=function(){ VIEW.sel=[]; paint(); return _rv.apply(this,arguments); }; }
  if(typeof clearKw==="function"){ var _ck=clearKw;
    clearKw=function(){ VIEW.sel=[]; paint(); return _ck.apply(this,arguments); }; }

  function idx(it){ for(var i=0;i<VIEW.sel.length;i++){
      if(VIEW.sel[i].k===it.k&&VIEW.sel[i].v===it.v) return i; } return -1; }
  function toggle(k,v){ var i=idx({k:k,v:v});
    if(i>=0) VIEW.sel.splice(i,1); else VIEW.sel.push({k:k,v:v});
    VIEW.page=0; if(typeof layout==="function") layout(); paint(); draw(); }
  window.kwselToggleItem=toggle;

  function paint(){
    var b=document.getElementById("kwselBtn");
    if(b){ var n=VIEW.sel.length;
      b.textContent = n ? ("◈ "+n+" selected · "+(VIEW.selMode==="all"?"ALL":"ANY")+" ▾")
                        : "◈ pick ▾";
      b.classList.toggle("on", n>0); }
    var els=document.querySelectorAll(".wm-themes span[data-t]");
    for(var i=0;i<els.length;i++)
      els[i].classList.toggle("on", idx({k:"th",v:els[i].getAttribute("data-t")})>=0);
    var pill=document.getElementById("kwpill"), txt=document.getElementById("kwtxt");
    if(VIEW.sel.length){ if(txt) txt.textContent=VIEW.sel.map(function(s){return s.v;}).join(
        VIEW.selMode==="all"?" AND ":" OR "); if(pill) pill.classList.add("on"); }
    else if(!VIEW.kw && pill){ pill.classList.remove("on"); } }

  function tally(){ var kw={}, th={}, V=window.kwBaseCards();
    V.forEach(function(o){ var a=tset(o), q;
      for(q in a) kw[q]=(kw[q]||0)+1;
      var b=gset(o); for(q in b) th[q]=(th[q]||0)+1; });
    return {kw:kw, th:th, n:V.length}; }

  function draw(){
    var pop=document.getElementById("kwselPop"); if(!pop||!pop.classList.contains("on")) return;
    if(!_TAL) _TAL=tally();
    var qi=document.getElementById("kwselQ"), q=((qi&&qi.value)||"").toLowerCase().trim();
    var rows=[], k;
    for(k in _TAL.th){ if(!q||k.toLowerCase().indexOf(q)>=0) rows.push({k:"th",v:k,n:_TAL.th[k]}); }
    rows.sort(function(a,b){ return b.n-a.n; });
    var kws=[]; for(k in _TAL.kw){ if(!q||k.indexOf(q)>=0) kws.push({k:"kw",v:k,n:_TAL.kw[k]}); }
    kws.sort(function(a,b){ return b.n-a.n || (a.v<b.v?-1:1); });
    var shown=kws.slice(0,120), more=kws.length-shown.length;
    rows=rows.concat(shown);
    var h='<div class="kwmode"><span class="mlab">combine</span>'+
      '<button data-m="any" class="'+(VIEW.selMode==="any"?"on":"")+'">any (union)</button>'+
      '<button data-m="all" class="'+(VIEW.selMode==="all"?"on":"")+'">all (overlap)</button></div>'+
      '<input class="kwq" id="kwselQ" placeholder="search themes and keywords…" value="'+
      (q?esc(q):"")+'">';
    if(VIEW.sel.length){ h+='<div class="kwsel">'+VIEW.sel.map(function(s){
      return '<span class="kwchip" data-rk="'+esc(s.k)+'" data-rv="'+esc(s.v)+'">'+esc(s.v)+
             '<span class="x">✕</span></span>'; }).join("")+'</div>'; }
    h+='<div class="kwlist">'+rows.map(function(r){
      return '<div class="kwrow'+(idx(r)>=0?" on":"")+'" data-k="'+esc(r.k)+'" data-v="'+esc(r.v)+'">'+
        '<span class="kwb">'+(r.k==="th"?"theme":"kw")+'</span>'+
        '<span class="kwt">'+esc(r.v)+'</span><span class="kwn">'+r.n+'</span></div>'; }).join("")+
      (more>0?'<div class="kwrow" style="cursor:default;opacity:.6">… '+more+
              ' more — keep typing to narrow</div>':"")+'</div>';
    h+='<div class="kwfoot"><span>'+_TAL.n+' papers in view</span>'+
       (VIEW.sel.length?'<button data-clr="1">clear selection</button>':'')+'</div>';
    pop.innerHTML=h;
    var inp=document.getElementById("kwselQ");
    if(inp){ inp.addEventListener("input", function(){ draw(); });
      inp.addEventListener("click", function(e){ e.stopPropagation(); });
      if(q){ inp.focus(); inp.setSelectionRange(q.length,q.length); } } }

  window.kwselToggle=function(ev){ if(ev) ev.stopPropagation();
    var pop=document.getElementById("kwselPop"), b=document.getElementById("kwselBtn");
    if(!pop||!b) return;
    if(pop.classList.contains("on")){ pop.classList.remove("on"); return; }
    _TAL=null; pop.classList.add("on");
    var r=b.getBoundingClientRect();
    pop.style.top=(r.bottom+5)+"px";
    pop.style.left=Math.max(8,Math.min(r.left,window.innerWidth-342))+"px";
    draw();
    var i=document.getElementById("kwselQ"); if(i) i.focus(); };

  document.addEventListener("click", function(e){
    var tt=e.target;
    var bub=tt&&tt.closest?tt.closest(".wm-themes span[data-t]"):null;
    if(bub){ toggle("th", bub.getAttribute("data-t")); return; }
    var pop=document.getElementById("kwselPop"); if(!pop) return;
    if(tt&&tt.closest&&tt.closest("#kwselPop")){
      e.stopPropagation();
      var md=tt.closest("button[data-m]");
      if(md){ VIEW.selMode=md.getAttribute("data-m"); VIEW.page=0;
              if(typeof layout==="function") layout(); paint(); draw(); return; }
      if(tt.closest("button[data-clr]")){ VIEW.sel=[]; VIEW.page=0;
              if(typeof layout==="function") layout(); paint(); draw(); return; }
      var ch=tt.closest(".kwchip");
      if(ch){ toggle(ch.getAttribute("data-rk"), ch.getAttribute("data-rv")); return; }
      var rw=tt.closest(".kwrow[data-v]");
      if(rw){ toggle(rw.getAttribute("data-k"), rw.getAttribute("data-v")); return; }
      return; }
    if(!(tt&&tt.closest&&tt.closest("#kwselBtn"))) pop.classList.remove("on"); });
  document.addEventListener("keydown", function(e){
    if(e.key==="Escape"){ var p=document.getElementById("kwselPop"); if(p) p.classList.remove("on"); } });

  /* first paint ran before themeSet() existed, so the themes panel still holds first-match counts */
  try{ _wmSig=null; }catch(err){}
  if(typeof layout==="function") layout();
  paint();
})();
</script>


<script>
/* Large-selection guard (lab page only). Rendering thousands of cards makes scrolling/filtering crawl,
   so when a selection exceeds the limit we ask first instead of freezing the tab. Wraps layout() rather
   than editing the personal generator. */
(function(){
  var BIG=1000, OKSIG=null, orig=window.layout;
  if(typeof orig!=='function') return;
  function sig(){ return [VIEW.filter,VIEW.minScore,VIEW.datef,VIEW.monStart,VIEW.monEnd,VIEW.kw,VIEW.search].join('|'); }
  window.__bigProceed=function(){ OKSIG=sig(); layout(); };
  window.__bigReset=function(){                       /* back to the lab default view, not a blank one */
    OKSIG=null; VIEW.filter='all'; VIEW.kw=null; VIEW.search=''; VIEW.page=0;
    VIEW.minScore=8; VIEW.datef='30d'; VIEW.monStart=null; VIEW.monEnd=null;
    var ms=document.getElementById('minScore'); if(ms) ms.value=8;
    var kp=document.getElementById('kwpill'); if(kp) kp.classList.remove('on');
    if(typeof syncSeg==='function'){ syncSeg('segFilter','all'); syncSeg('segDate','30d'); syncSeg('segSort','score'); }
    layout(); };
  window.layout=function(){
    var z=document.getElementById('cardzone'), n;
    try{ n=CARDS.filter(passFilter).length; }catch(e){ return orig.apply(this,arguments); }
    if(z && n>BIG && sig()!==OKSIG){
      var nv=document.getElementById('nav'); if(nv) nv.innerHTML='';
      z.innerHTML='<div class="emptystate"><div class="es-ic">&#9888;&#65039;</div>'
        +'<div class="es-msg"><b>'+n.toLocaleString()+' papers</b> match this selection.<br>'
        +'Showing more than '+BIG.toLocaleString()+' at once can make the page slow to scroll and filter.</div>'
        +'<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px">'
        +'<button class="es-btn" onclick="__bigProceed()">Show all '+n.toLocaleString()+' anyway</button>'
        +'<button class="es-btn" onclick="__bigReset()">Back to default view</button></div></div>';
      return; }
    return orig.apply(this,arguments); };
})();
</script>
